<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qur'anic Words App - Modern Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color-1: #0f172a;
            --bg-color-2: #1e1b4b;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --primary-hover: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #38bdf8;
            --gold: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color-1);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Modern Animated Background Orbs --- */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.6;
            animation: floatOrb 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -10%; left: -10%; }
        .orb-2 { width: 500px; height: 500px; background: var(--secondary); bottom: -20%; right: -10%; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: var(--accent); top: 30%; left: 60%; animation-delay: -10s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 80px) scale(1.2); }
            100% { transform: translate(-50px, 40px) scale(0.9); }
        }

        /* --- Glassmorphism Panels --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px;
            width: 95%;
            max-width: 750px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: absolute;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(30px) scale(0.95);
            z-index: 10;
        }

        .glass-panel.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            position: relative;
        }

        .glass-panel.wide { max-width: 1050px; }

        /* --- Typography --- */
        h1 {
            font-weight: 800;
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a78bfa, #38bdf8, #ec4899);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 5s linear infinite;
        }
        
        @keyframes gradientText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 1.15rem;
            font-weight: 300;
        }

        .word-prompt {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            animation: floatText 3s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            width: 0%;
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* --- Inputs & Selects --- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group.full-width { grid-column: 1 / -1; }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            font-weight: 600;
        }

        select, input[type="text"] {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px 20px;
            color: white;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            appearance: none;
            cursor: pointer;
        }
        
        select option { background: var(--bg-color-1); color: white; }

        select:hover, input[type="text"]:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }

        .arabic-input {
            font-family: 'Amiri', serif;
            font-size: 2.5rem !important;
            text-align: center;
            letter-spacing: 2px;
            cursor: default !important;
        }

        /* --- Interactive Keyboard --- */
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.25);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .key {
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            min-width: 45px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(10px);
        }

        .key.show {
            opacity: 1;
            transform: translateY(0);
        }

        .key:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 15px rgba(0,0,0,0.4), 0 0 10px rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }

        .key:active {
            transform: translateY(2px) scale(0.95);
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            border-color: var(--primary);
        }

        .key.action-key {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            min-width: 85px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Modern Buttons --- */
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 18px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            transition: all 0.6s ease;
        }

        .btn:hover::after { left: 150%; }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #be185d);
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            box-shadow: none;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .btn:active { transform: translateY(2px); }

        /* --- Flashcards (Study Mode) --- */
        .flashcard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 20px;
            max-height: 65vh;
            overflow-y: auto;
            padding: 10px;
            padding-right: 15px;
        }

        .flashcard-grid::-webkit-scrollbar { width: 8px; }
        .flashcard-grid::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .flashcard-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
        .flashcard-grid::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .flashcard {
            background: transparent;
            height: 200px;
            perspective: 1500px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .flashcard:hover .flashcard-inner {
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
        }

        .flashcard-front {
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            backdrop-filter: blur(10px);
        }
        
        .flashcard-front .arabic {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .flashcard-back {
            background: linear-gradient(135deg, var(--primary), var(--bg-color-2));
            color: white;
            transform: rotateY(180deg);
        }

        .flashcard-back h3 { font-size: 1.5rem; margin-bottom: 12px; font-weight: 800;}
        .flashcard-back p { font-size: 0.95rem; opacity: 0.9; margin-bottom: 5px; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 8px; }

        /* --- Quiz Header & Results --- */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .score-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        
        .progress-badge {
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .result-msg {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 15px;
            margin-bottom: 25px;
            min-height: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
        }

        .result-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Validation States --- */
        .correct { border-color: var(--success) !important; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5) !important; background: rgba(16, 185, 129, 0.1) !important;}
        .wrong { border-color: var(--danger) !important; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important; background: rgba(239, 68, 68, 0.1) !important;}

        .shake { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* --- Confetti Animation --- */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 20px;
            background: #fff;
            top: -20px;
            z-index: 9999;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .glass-panel { padding: 30px 20px; border-radius: 20px; }
            .form-grid { grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px;}
            .key { min-width: 34px; padding: 12px 6px; font-size: 1.3rem; }
            .word-prompt { font-size: 2rem; margin-bottom: 25px;}
            .arabic-input { font-size: 2rem !important; padding: 12px;}
            .flashcard-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
        }

        @media (max-width: 480px) {
            .flashcard-grid { grid-template-columns: 1fr; }
            .key { min-width: 28px; padding: 10px 4px; font-size: 1.2rem; }
            .key.action-key { font-size: 0.85rem; min-width: 70px;}
            h1 { font-size: 1.8rem; }
            .btn { padding: 15px 20px; font-size: 1rem;}
        }
    </style>
</head>
<body>

    <!-- Animated Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- MAIN MENU -->
    <div class="glass-panel active" id="screen-menu">
        <h1>Qur'anic Words</h1>
        <p class="subtitle">Master the top 59 most frequent words up to "ahsan" (أحسن).</p>
        
        <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 30px;">
            <button class="btn" onclick="startQuiz()">Play Interactive Quiz</button>
            <button class="btn btn-secondary" onclick="openStudyMode()">Study Mode (Flashcards)</button>
        </div>
    </div>

    <!-- STUDY MODE -->
    <div class="glass-panel wide" id="screen-study">
        <h1>Study Guide</h1>
        <p class="subtitle">Tap any card to reveal its translation and details.</p>
        <button class="btn btn-outline" style="width: auto; padding: 12px 25px;" onclick="showMenu()">← Back to Menu</button>
        
        <div class="flashcard-grid" id="study-grid">
            <!-- Flashcards injected via JS -->
        </div>
    </div>

    <!-- QUIZ MODE -->
    <div class="glass-panel" id="screen-quiz">
        <div class="quiz-header">
            <button class="btn btn-outline" style="width: auto; padding: 8px 16px; font-size: 0.9rem; margin:0;" onclick="showMenu()">Quit</button>
            <div class="progress-badge" id="progress-text">Word 1 / 59</div>
            <div class="score-badge" id="score-text">Score: 0</div>
        </div>
        
        <!-- Animated Progress Bar -->
        <div class="progress-container">
            <div class="progress-fill" id="progress-bar"></div>
        </div>

        <div class="word-prompt" id="transliteration-prompt" style="margin-top: 25px;"></div>

        <div class="form-grid">
            <div class="input-group">
                <label>Meaning</label>
                <select id="input-meaning">
                    <option value="" disabled selected>Select meaning...</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Part of Speech</label>
                <select id="input-pos">
                    <option value="" disabled selected>Select type...</option>
                    <option value="Noun">Noun</option>
                    <option value="Verb">Verb</option>
                    <option value="Particle">Particle</option>
                </select>
            </div>

            <div class="input-group">
                <label>Occurrences in Qur'an</label>
                <select id="input-occ">
                    <option value="" disabled selected>Select count...</option>
                </select>
            </div>

            <div class="input-group full-width">
                <label>Spell in Arabic</label>
                <input type="text" id="input-arabic" class="arabic-input" dir="rtl" placeholder="Type here..." readonly>
                
                <div class="keyboard" id="arabic-keyboard">
                    <!-- Keyboard generated by JS -->
                </div>
            </div>
        </div>

        <div class="result-msg" id="result-msg"></div>
        <button class="btn" id="btn-action" onclick="checkAnswer()">Check Answer</button>
    </div>

    <!-- END SCREEN -->
    <div class="glass-panel" id="screen-end">
        <h1>Quiz Complete!</h1>
        <p class="subtitle" id="final-score-text" style="font-size: 1.5rem; color: var(--gold); font-weight: 700; margin-bottom: 40px;"></p>
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <button class="btn" onclick="startQuiz()">Play Again</button>
            <button class="btn btn-secondary" onclick="showMenu()">Back to Main Menu</button>
        </div>
    </div>

            { a: "من", t: "min", m: "from", o: 3215, p: "Particle" },
            { a: "عن", t: "'an", m: "with", o: 416, p: "Particle" },
            { a: "لقد", t: "laqad", m: "certainly", o: 406, p: "Particle" },
            { a: "قران", t: "Al-Qur'aan", m: "the Qur'an", o: 70, p: "Noun" },
            { a: "ان", t: "'in", m: "if", o: 691, p: "Particle" },
            { a: "شاء", t: "shaa'a", m: "wills", o: 56, p: "Verb" },
            { a: "ان", t: "'inna", m: "indeed", o: 1534, p: "Particle" },
            { a: "انما", t: "'innamaa", m: "only", o: 145, p: "Particle" },
            { a: "عمل", t: "'amal", m: "deed", o: 41, p: "Noun" },
            { a: "ب", t: "bi", m: "in", o: 510, p: "Particle" },
            { a: "في", t: "fee", m: "in/into", o: 1684, p: "Particle" },
            { a: "سبيل", t: "As-sabeel", m: "the way", o: 176, p: "Noun" },
            { a: "على", t: "'alaa", m: "on; upon", o: 1423, p: "Particle" },
            { a: "الذي", t: "'allazee", m: "(the one) who", o: 304, p: "Noun" },
            { a: "اي", t: "'ayyun", m: "which", o: 59, p: "Noun" },
            { a: "احسن", t: "'ahsan", m: "best", o: 36, p: "Noun" }
        ];

        // Arabic Keyboard Layout (UPDATED: Added 'ذ' to the top row)
        const kbLayout = [
            ['ض', 'ص', 'ث', 'ق', 'ف', 'غ', 'ع', 'ه', 'خ', 'ح', 'ج', 'د', 'ذ'],
            ['ش', 'س', 'ي', 'ب', 'ل', 'ا', 'ت', 'ن', 'م', 'ك', 'ط'],
            ['ئ', 'ء', 'ؤ', 'ر', 'لا', 'ى', 'ة', 'و', 'ز', 'ظ'],
            ['Space', 'Backspace']
        ];

        // State Variables
        let quizWords = [];
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;
        
        // Utils
        const shuffle = (array) => array.sort(() => Math.random() - 0.5);
        const getEl = (id) => document.getElementById(id);
        
        // Normalize Arabic Text
        function normalizeArabic(text) {
            return text.replace(/[\u064B-\u065F]/g, '')
                       .replace(/[أإآ]/g, 'ا')
                       .replace(/ة/g, 'ه');
        }

        // Screen Navigation
        function switchScreen(screenId) {
            document.querySelectorAll('.glass-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            setTimeout(() => {
                getEl(screenId).classList.add('active');
            }, 100); // Slight delay for smoother cross-fade
        }

        function showMenu() { switchScreen('screen-menu'); }

        function openStudyMode() {
            switchScreen('screen-study');
            renderFlashcards();
        }

        // Generate Flashcards
        function renderFlashcards() {
            const grid = getEl('study-grid');
            grid.innerHTML = '';
            
            wordsData.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'flashcard';
                // Staggered entrance
                setTimeout(() => {
                    card.style.opacity = '1';
                }, index * 30);
                card.style.opacity = '0';
                card.style.transition = 'opacity 0.5s ease';
                
                card.innerHTML = `
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <div class="arabic">${word.a}</div>
                            <div style="color: var(--text-muted); font-size: 1rem; font-weight: 600;">${word.t}</div>
                        </div>
                        <div class="flashcard-back">
                            <h3>${word.m}</h3>
                            <p><strong>Type:</strong> ${word.p}</p>
                            <p><strong>Freq:</strong> ${word.o}</p>
                        </div>
                    </div>
                `;
                
                card.onclick = () => card.classList.toggle('flipped');
                grid.appendChild(card);
            });
        }

        // Initialize Animated Keyboard
        function renderKeyboard() {
            const kbContainer = getEl('arabic-keyboard');
            kbContainer.innerHTML = '';
            let keyIndex = 0;

            kbLayout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                row.forEach(key => {
                    const btn = document.createElement('div');
                    btn.className = 'key' + (key.length > 2 ? ' action-key' : '');
                    btn.textContent = key;
                    btn.onclick = () => handleKeyPress(key, btn);
                    
                    // Staggered animation entrance
                    setTimeout(() => {
                        btn.classList.add('show');
                    }, keyIndex * 15);
                    keyIndex++;

                    rowDiv.appendChild(btn);
                });
                kbContainer.appendChild(rowDiv);
            });
        }

        function handleKeyPress(key, btnElement) {
            if(isAnswered) return;
            const input = getEl('input-arabic');
            
            if (key === 'Backspace') {
                input.value = input.value.slice(0, -1);
            } else if (key === 'Space') {
                input.value += ' ';
            } else {
                input.value += key;
            }
        }

        // Setup Quiz
        function startQuiz() {
            switchScreen('screen-quiz');
            
            // Reset Quiz State
            quizWords = shuffle([...wordsData]);
            currentIndex = 0;
            score = 0;
            loadWord();
        }

        function updateProgress() {
            const progressPercent = (currentIndex / quizWords.length) * 100;
            getEl('progress-bar').style.width = `${progressPercent}%`;
            getEl('progress-text').innerText = `Word ${currentIndex + 1} / ${quizWords.length}`;
        }

        function loadWord() {
            isAnswered = false;
            const word = quizWords[currentIndex];
            
            // Reset UI
            updateProgress();
            getEl('score-text').innerText = `Score: ${score}`;
            
            const promptEl = getEl('transliteration-prompt');
            promptEl.style.opacity = 0;
            setTimeout(() => {
                promptEl.innerText = word.t;
                promptEl.style.opacity = 1;
                promptEl.style.transition = 'opacity 0.4s ease';
            }, 200);

            getEl('input-arabic').value = '';
            
            const msgEl = getEl('result-msg');
            msgEl.classList.remove('show');
            
            getEl('btn-action').innerText = 'Check Answer';
            getEl('btn-action').onclick = checkAnswer;
            
            // Remove validation styling
            ['input-meaning', 'input-pos', 'input-occ', 'input-arabic'].forEach(id => {
                getEl(id).classList.remove('correct', 'wrong');
            });

            // Generate Meaning Options
            const meaningSelect = getEl('input-meaning');
            const wrongMeanings = shuffle(wordsData.filter(w => w.m !== word.m)).slice(0, 3).map(w => w.m);
            const allMeanings = shuffle([word.m, ...wrongMeanings]);
            meaningSelect.innerHTML = '<option value="" disabled selected>Select meaning...</option>';
            allMeanings.forEach(m => {
                meaningSelect.innerHTML += `<option value="${m}">${m}</option>`;
            });

            // Reset POS
            getEl('input-pos').value = '';

            // Generate Occurrence Options
            const occSelect = getEl('input-occ');
            const wrongOcc = [
                Math.max(1, word.o + Math.floor(Math.random() * 50) + 5),
                Math.max(1, word.o - Math.floor(Math.random() * 20) - 2),
                wordsData[Math.floor(Math.random() * wordsData.length)].o
            ];
            const allOcc = shuffle([...new Set([word.o, ...wrongOcc])]); 
            occSelect.innerHTML = '<option value="" disabled selected>Select count...</option>';
            allOcc.forEach(o => {
                occSelect.innerHTML += `<option value="${o}">${o}</option>`;
            });

            // Re-render keyboard for animation effect
            renderKeyboard();
        }

        // Confetti Generator
        function fireConfetti() {
            const colors = ['#6366f1', '#ec4899', '#10b981', '#fbbf24', '#38bdf8'];
            for(let i=0; i<40; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti-piece';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(conf);
                
                setTimeout(() => conf.remove(), 4000);
            }
        }

        function checkAnswer() {
            const word = quizWords[currentIndex];
            
            const valMeaning = getEl('input-meaning').value;
            const valPos = getEl('input-pos').value;
            const valOcc = parseInt(getEl('input-occ').value);
            const valArabic = normalizeArabic(getEl('input-arabic').value.trim());
            const correctArabic = normalizeArabic(word.a);

            if (!valMeaning || !valPos || isNaN(valOcc) || !valArabic) {
                // Shake button if fields are empty
                const btn = getEl('btn-action');
                btn.classList.add('shake');
                setTimeout(() => btn.classList.remove('shake'), 600);
                return;
            }

            isAnswered = true;
            let allCorrect = true;

            // Validation Logic
            if (valMeaning === word.m) getEl('input-meaning').classList.add('correct');
            else { getEl('input-meaning').classList.add('wrong'); allCorrect = false; }

            if (valPos === word.p) getEl('input-pos').classList.add('correct');
            else { getEl('input-pos').classList.add('wrong'); allCorrect = false; }

            if (valOcc === word.o) getEl('input-occ').classList.add('correct');
            else { getEl('input-occ').classList.add('wrong'); allCorrect = false; }

            if (valArabic === correctArabic) getEl('input-arabic').classList.add('correct');
            else { getEl('input-arabic').classList.add('wrong'); allCorrect = false; }

            const msgEl = getEl('result-msg');
            msgEl.classList.add('show');
            
            if (allCorrect) {
                score++;
                getEl('score-text').innerText = `Score: ${score}`;
                msgEl.innerText = "✨ Perfect! Outstanding job! ✨";
                msgEl.style.color = "var(--success)";
                fireConfetti(); // Trigger celebration
            } else {
                getEl('screen-quiz').classList.add('shake');
                setTimeout(() => getEl('screen-quiz').classList.remove('shake'), 600);
                
                msgEl.innerHTML = `Incorrect. Exact spelling is <b>${word.a}</b> (${word.p}), meaning <b>${word.m}</b> (Occurs <b>${word.o}</b> times).`;
                msgEl.style.color = "var(--danger)";
            }

            getEl('btn-action').innerText = 'Next Word →';
            getEl('btn-action').onclick = nextWord;
        }

        function nextWord() {
            currentIndex++;
            if (currentIndex >= quizWords.length) {
                endQuiz();
            } else {
                loadWord();
            }
        }

        function endQuiz() {
            switchScreen('screen-end');
            getEl('progress-bar').style.width = '100%';
            
            const finalScoreText = getEl('final-score-text');
            finalScoreText.innerText = `You scored ${score} out of ${quizWords.length}!`;
            
            // Big celebration if score is good
            if(score > quizWords.length / 2) {
                setTimeout(fireConfetti, 500);
                setTimeout(fireConfetti, 1500);
            }
        }
    </script>
</body>
</html>
